[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricvibe"
version = "1.1.0"
description = "Cinematic 165Hz Floating Lyrics Overlay for Spotify"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Arsh Pathan" }
]
dependencies = [
    "PyQt6>=6.5.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
lyricvibe = "lyricvibe.ui.overlay:run_app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
